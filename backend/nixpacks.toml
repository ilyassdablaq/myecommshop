[phases.setup]
nixPkgs = ["nodejs_20"]
cmds = [
	"corepack enable",
	"corepack prepare yarn@stable --activate"
]

[phases.install]
cmds = ["yarn install --immutable"]

[phases.build]
cmds = ["yarn run build"]

[start]
cmd = "npm start"

[variables]
NODE_ENV = "production"
NODE_OPTIONS = "--max-old-space-size=2048"
